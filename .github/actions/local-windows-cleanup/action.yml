name: Clean local Windows job files
description: Remove only this job's tools and generated checkout files
runs:
  using: composite
  steps:
    # Windows PowerShell remains available after the portable pwsh is removed.
    - shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:SMD_CI_WINDOWS_ROOT) {
            $Root = [IO.Path]::GetFullPath($env:SMD_CI_WINDOWS_ROOT)
            $Parent = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
            $Prefix = 'smd-hmi-{0}-{1}-{2}-' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:GITHUB_JOB
            if ([IO.Path]::GetDirectoryName($Root) -ne $Parent -or
                [IO.Path]::GetFileName($Root) -notmatch ('^' + [regex]::Escape($Prefix) + '[0-9a-f]{32}$')) {
                throw 'Unexpected Windows job tools path'
            }
            Set-Location $env:GITHUB_WORKSPACE
            $GitRoot = (& git rev-parse --show-toplevel)
            if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($GitRoot) -ne [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)) {
                throw 'Refusing cleanup outside this checkout'
            }
            git clean -ffdxq
            if ($LASTEXITCODE -ne 0) { throw 'Checkout cleanup failed' }
            Remove-Item -LiteralPath $Root -Recurse -Force
        }
