version: 2
updates:
  # Python updates must also regenerate both hash locks; shared CI rejects txt-only drift.
  - package-ecosystem: pip
    directories: [/backend, /desktop]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      python-patch-minor:
        patterns: ['*']
        update-types: [patch, minor]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      frontend-runtime:
        dependency-type: production
        update-types: [patch, minor]
      frontend-tooling:
        dependency-type: development
        update-types: [patch, minor]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-patch-minor:
        patterns: ['*']
        update-types: [patch, minor]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
