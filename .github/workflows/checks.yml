          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ci-venv\Scripts"
      - run: pip install --require-hashes -r backend/requirements.lock -r desktop/requirements.lock
      # NSIS 便携版供给:官方 zip 随仓库下发(third_party/nsis,哈希已与官方源、
      # Chocolatey 包载荷双源交叉核验),使用前重校 SHA256,解包到 runner 自有
      # 目录,经 SMD_MAKENSIS 传给构建脚本——不做系统级安装。托管 runner 不走
      # 此步骤,SMD_MAKENSIS 未设置时构建脚本回退 ProgramFiles 标准路径。
      - name: Provision portable NSIS 3.11 (runner 自有目录)
        run: |
          $ErrorActionPreference = 'Stop'
          $WorkRoot = Split-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) -Parent
          $NsisDir = Join-Path $WorkRoot 'smd-ci-tools\nsis-3.11'
          $MakeNsis = Join-Path $NsisDir 'makensis.exe'
          if (-not (Test-Path $MakeNsis)) {
            $Zip = Join-Path $env:GITHUB_WORKSPACE 'third_party\nsis\nsis-3.11.zip'
            $Sha256 = 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1'
            $Actual = (Get-FileHash -Algorithm SHA256 -Path $Zip).Hash.ToLowerInvariant()
            if ($Actual -ne $Sha256) { throw "vendored NSIS zip sha256 mismatch: $Actual" }
            $Extract = Join-Path $WorkRoot 'smd-ci-tools\nsis-extract'
            if (Test-Path $Extract) { Remove-Item -Recurse -Force $Extract }
            New-Item -ItemType Directory -Force -Path $Extract | Out-Null
            & (Join-Path $env:SystemRoot 'System32\tar.exe') -xf $Zip -C $Extract
            if ($LASTEXITCODE -ne 0) { throw 'NSIS zip extraction failed' }
            if (Test-Path $NsisDir) { Remove-Item -Recurse -Force $NsisDir }
            Move-Item (Join-Path $Extract 'nsis-3.11') $NsisDir
            Remove-Item -Recurse -Force $Extract
            if (-not (Test-Path $MakeNsis)) { throw 'makensis.exe missing after extraction' }
          }
          $V = (& $MakeNsis /VERSION | Out-String).Trim()
          if ($V -ne 'v3.11') { throw "unexpected makensis version: $V" }
          Add-Content -Path $env:GITHUB_ENV -Value "SMD_MAKENSIS=$MakeNsis"
      - name: Freeze service, shell and updater; verify Fixed Runtime; compile NSIS
        run: ./scripts/release/build-windows.ps1
      - name: Build the separate offline bench and bundled Chromium
        # 步骤级超时:Chromium 走 Playwright 官方 CDN(实测本服务器可达);挂死时尽早失败。
        # SmdBench 自检按设计为私有证据目录设 Administrators 所有者(现场隐私保证),
        # 非管理员 runner 无法执行:按能力实探,有特权则完整自检(与托管一致),
        # 无特权则在 step summary 显式记录"未执行",仍执行非特权的 bundle 清单校验;
        # 托管 windows-build(管理员)照常完整自检,验收口径不变。
        timeout-minutes: 25
        run: |
          pip install --require-hashes -r tools/bench/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Bench dependency installation failed' }
          python tools/bench/freeze.py --output artifacts/bench --work artifacts/bench-work
          if ($LASTEXITCODE -ne 0) { throw 'Bench freeze failed' }
          $Probe = python -c "import sys; sys.path[:0]=['tools/bench','tools/bench/tests']; from windows_capabilities import can_assign_administrators_owner as f; print(int(f()))"
          if ($LASTEXITCODE -ne 0) { throw 'privilege probe failed' }
          if ("$Probe".Trim() -eq '1') {
            & ./artifacts/bench/SmdBench/SmdBench.exe self-check
            if ($LASTEXITCODE -ne 0) { throw 'Frozen bench process and browser self-check failed' }
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'SmdBench self-check: NOT EXECUTED on this runner (requires privilege to assign Administrators owner; covered by hosted windows-build and real-machine acceptance)'
            Write-Output 'SmdBench self-check skipped: requires admin-owner privilege; recorded in step summary'
          }
          python scripts/release/package_bench.py --bundle artifacts/bench/SmdBench --inventory-only
          if ($LASTEXITCODE -ne 0) { throw 'Bench bundle inventory verification failed' }
      - name: Retain build artifacts on this runner (Actions 工件配额受限时的留存点)
        run: |
          $Version = (& python scripts/release/metadata.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source version mismatch' }
          $WorkRoot = Split-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) -Parent
          $Retain = Join-Path $WorkRoot ("smd-retained-artifacts\run-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $Retain -Force | Out-Null
          foreach ($Name in @("SmdHmi-$Version-windows-x64.exe", 'manifest.json', 'sbom.cdx.json', 'SHA256SUMS.txt')) {
            Copy-Item (Join-Path 'artifacts' $Name) $Retain
          }
          $Lines = @('### windows-build-local artifacts retained on runner', "- path: $Retain")
          Get-ChildItem $Retain -File | ForEach-Object {
            $H = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $Lines += ('- ' + $_.Name + ' | ' + $_.Length + ' bytes | sha256=' + $H)
          }
          $Lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          $Lines | Write-Output
      - name: Upload artifacts when quota permits
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-local-build-${{ github.run_attempt }}
          path: |
            artifacts/SmdHmi-*.exe
            artifacts/manifest.json
            artifacts/sbom.cdx.json
            artifacts/SHA256SUMS.txt
          retention-days: 7
