              if ($Actual -eq $Sha256) { $Downloaded = $true; break }
              Write-Output "failed: sha256 mismatch $Actual"
            }
            if (-not $Downloaded) { throw 'No Python source passed download + SHA256 pin; pre-provision CPython 3.13 on this server (on PATH or in smd-ci-tools\py313). This workflow does not modify system components.' }
