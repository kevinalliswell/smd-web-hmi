name: Shared checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: python scripts/release/metadata.py && python scripts/release/check_locks.py
      - run: python scripts/check_docs.py
      - run: python scripts/check_hostcomm_contract.py
      - run: black --config backend/pyproject.toml --check backend/app backend/tests desktop tools/bench scripts/release contracts scripts/check_hostcomm_contract.py
      - run: isort --settings-path backend/pyproject.toml --check-only backend/app backend/tests desktop tools/bench scripts/release contracts scripts/check_hostcomm_contract.py
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.11' 
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - name: Safety red lines first
        working-directory: backend
        run: pytest tests/test_safety.py -v
      - name: Empty database migration
        working-directory: backend
        run: alembic upgrade head
      - name: Desktop transaction and process tests
        if: matrix.python == '3.13'
        run: pytest -c backend/pytest.ini desktop/tests -q
      - name: Independent bench behavior tests
        if: matrix.python == '3.13'
        run: |
          pip install --require-hashes -r tools/bench/requirements.lock
          pytest -c backend/pytest.ini tools/bench/tests -q
      - name: Backend tests and coverage gate
        timeout-minutes: 15
        working-directory: backend
        run: pytest -v --maxfail=1 -o faulthandler_timeout=60 --durations=10 --cov=app --cov-report=term --cov-fail-under=80
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem deploy/windows,scripts/release -Filter *.ps1 -Recurse | ForEach-Object {
            $Tokens = $null; $ParseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors)
            if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
          }
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cross-language HostComm canonical bytes
        working-directory: .
        run: node contracts/hostcomm/v2/verify-js.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r backend/requirements-dev.lock
        working-directory: .
      - run: npm ci
      - run: npm run api:schema && git diff --exit-code -- src/api/generated/openapi.json
      - run: npm run types:check && npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pipx run pip-audit -r backend/requirements.lock --no-deps --disable-pip
      - run: pipx run pip-audit -r desktop/requirements.lock --no-deps --disable-pip
      - run: pipx run pip-audit -r tools/bench/requirements.lock --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: frontend
        run: npm audit --audit-level=high
  windows-package:
    needs: [lint, backend, frontend, audit]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            desktop/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock -r desktop/requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: choco install nsis --version=3.11 -y --no-progress
      - name: Freeze service, shell and updater; verify Fixed Runtime; compile NSIS
        shell: pwsh
        run: ./scripts/release/build-windows.ps1
      - name: Install NSIS and verify the isolated LocalService backend
        shell: pwsh
        run: |
          $Version = (& python scripts/release/metadata.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source version mismatch' }
          ./scripts/release/smoke-windows.ps1 -Installer "artifacts/SmdHmi-$Version-windows-x64.exe" -Manifest artifacts/manifest.json -Evidence artifacts/windows-install-smoke.json
      - name: Build the separate offline bench and bundled Chromium
        shell: pwsh
        run: |
          pip install --require-hashes -r tools/bench/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Bench dependency installation failed' }
          python tools/bench/freeze.py --output artifacts/bench --work artifacts/bench-work
          if ($LASTEXITCODE -ne 0) { throw 'Bench freeze failed' }
      - name: Installed TLS, experiment, recovery and report loop
        shell: pwsh
        timeout-minutes: 25
        run: |
          $Version = (& python scripts/release/metadata.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source version mismatch' }
          & ./artifacts/bench/SmdBench/SmdBench.exe run --installer "artifacts/SmdHmi-$Version-windows-x64.exe" --manifest artifacts/manifest.json --evidence artifacts/bench-evidence --scenario all
          if ($LASTEXITCODE -ne 0) { throw 'Installed HostComm bench failed; inspect sanitized evidence' }
          python scripts/release/package_bench.py --bundle artifacts/bench/SmdBench --output artifacts --evidence artifacts/bench-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Bench packaging or acceptance gate failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-diagnostics
          path: |
            artifacts/windows-install-smoke.json
            artifacts/freeze-work/**/warn-*.txt
            artifacts/bench-evidence/**
            artifacts/bench-work/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-offline-installer
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/bench-manifest.json
            artifacts/bench-acceptance.json
            artifacts/manifest.json
            artifacts/sbom.cdx.json
            artifacts/SHA256SUMS.txt
            artifacts/*.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-metadata
          path: |
            artifacts/manifest.json
            artifacts/bench-manifest.json
            artifacts/bench-acceptance.json
            artifacts/sbom.cdx.json
            artifacts/SHA256SUMS.txt
            artifacts/*.md
          if-no-files-found: error
          retention-days: 90
