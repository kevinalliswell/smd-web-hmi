            if (Test-Path $Extract) { Remove-Item -Recurse -Force $Extract }
            New-Item -ItemType Directory -Force -Path $Extract | Out-Null
            & (Join-Path $env:SystemRoot 'System32\tar.exe') -xzf $Archive -C $Extract
            if ($LASTEXITCODE -ne 0) { throw 'archive extraction failed' }
            if (Test-Path $PyDir) { Remove-Item -Recurse -Force $PyDir }
            Move-Item (Join-Path $Extract 'python') $PyDir
            Remove-Item -Recurse -Force $Extract
            $PyExe = Join-Path $PyDir 'python.exe'
            if (-not (Test-Path $PyExe)) { throw 'python.exe missing after extraction' }
          }
          & $PyExe --version
          & $PyExe -m venv "$env:RUNNER_TEMP\ci-venv"
