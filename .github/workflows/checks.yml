name: Shared checks
on:
  workflow_call:
    inputs:
      local_mac:
        description: Use the repository's trusted persistent Mac runner
        type: boolean
        default: false
      local_windows:
        description: Use the trusted Server 2019 runner for compile-only validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lint:
    runs-on: ${{ inputs.local_mac && fromJSON('["self-hosted", "macOS", "ARM64", "local-mac", "smd-web"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: ./.github/actions/local-mac-python
        if: runner.os == 'macOS'
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: python scripts/release/metadata.py && python scripts/release/check_locks.py
      - run: python scripts/check_docs.py
      - run: python scripts/check_hostcomm_contract.py
      - run: black --config backend/pyproject.toml --check backend/app backend/tests desktop tools/bench scripts/release contracts scripts/check_hostcomm_contract.py
      - run: isort --settings-path backend/pyproject.toml --check-only backend/app backend/tests desktop tools/bench scripts/release contracts scripts/check_hostcomm_contract.py
      - uses: ./.github/actions/local-mac-cleanup
        if: ${{ always() && runner.os == 'macOS' }}
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, local-mac]
        python: ['3.13']
        exclude:
          # Keep all original hosted checks for untrusted PRs; Mac is additive.
          - os: ${{ inputs.local_mac && 'not-selected' || 'local-mac' }}
        include:
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os == 'local-mac' && fromJSON('["self-hosted", "macOS", "ARM64", "local-mac", "smd-web"]') || matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: ./.github/actions/local-mac-python
        if: runner.os == 'macOS'
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - name: Native Windows service and ACL test dependencies
        if: runner.os == 'Windows'
        run: pip install --require-hashes -r desktop/requirements.lock
      - name: Safety red lines first
        working-directory: backend
        run: pytest tests/test_safety.py -v
      - name: Empty database migration
        working-directory: backend
        run: alembic upgrade head
      - name: Desktop transaction and process tests
        if: matrix.python == '3.13'
        run: pytest -c backend/pytest.ini desktop/tests -q
      - name: Independent bench behavior tests
        if: matrix.python == '3.13'
        run: |
          pip install --require-hashes -r tools/bench/requirements.lock
          pytest -c backend/pytest.ini tools/bench/tests -q
      - name: Backend tests and coverage gate
        timeout-minutes: 15
        working-directory: backend
        run: pytest -v --maxfail=1 -o faulthandler_timeout=60 --durations=10 --cov=app --cov-report=term --cov-fail-under=80
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem deploy/windows,scripts/release -Filter *.ps1 -Recurse | ForEach-Object {
            $Tokens = $null; $ParseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors)
            if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
          }
      - uses: ./.github/actions/local-mac-cleanup
        if: ${{ always() && runner.os == 'macOS' }}
  frontend:
    runs-on: ${{ inputs.local_mac && fromJSON('["self-hosted", "macOS", "ARM64", "local-mac", "smd-web"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cross-language HostComm canonical bytes
        working-directory: .
        run: node contracts/hostcomm/v2/verify-js.mjs
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: '3.13'
      - uses: ./.github/actions/local-mac-python
        if: runner.os == 'macOS'
      - run: pip install --require-hashes -r backend/requirements-dev.lock
        working-directory: .
      - run: npm ci
      - run: npm run api:schema && git diff --exit-code -- src/api/generated/openapi.json
      - run: npm run types:check && npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
      - uses: ./.github/actions/local-mac-cleanup
        if: ${{ always() && runner.os == 'macOS' }}
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pipx run pip-audit -r backend/requirements.lock --no-deps --disable-pip
      - run: pipx run pip-audit -r desktop/requirements.lock --no-deps --disable-pip
      - run: pipx run pip-audit -r tools/bench/requirements.lock --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: frontend
        run: npm audit --audit-level=high
  windows-compile:
    # Additive portability check. Hosted Windows tests/build/package remain required.
    if: inputs.local_windows
    runs-on: [self-hosted, Windows, X64, local-windows, windows-build, smd-web]
    timeout-minutes: 90
    steps:
      - name: Bootstrap private Git before checkout
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $Root = Join-Path $env:RUNNER_TEMP ('smd-hmi-{0}-{1}-{2}-{3}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:GITHUB_JOB, [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $Root | Out-Null
          $Utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SMD_CI_WINDOWS_ROOT=$Root`n", $Utf8)
          try {
              $Zip = Join-Path $Root 'git.zip'
              $Cached = Join-Path $env:RUNNER_TOOL_CACHE 'smd-archives/MinGit-2.55.0.5-64-bit.zip'
              if (Test-Path -LiteralPath $Cached -PathType Leaf) {
                  Copy-Item -LiteralPath $Cached -Destination $Zip
              } else {
                  curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 300 --output $Zip 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip'
                  if ($LASTEXITCODE -ne 0) { throw 'Private Git download failed or exceeded its deadline' }
              }
              if ((Get-FileHash $Zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '56d7b226b7693196cfc71fef26568f536c4a021ab6c37ff2db4287bed908e96e') { throw 'MinGit archive digest mismatch' }
              Expand-Archive -LiteralPath $Zip -DestinationPath (Join-Path $Root 'git')
              [IO.File]::AppendAllText($env:GITHUB_PATH, (Join-Path $Root 'git/cmd') + "`n", $Utf8)
              Remove-Item -LiteralPath $Zip
              & (Join-Path $Root 'git/cmd/git.exe') --version
              if ($LASTEXITCODE -ne 0) { throw 'Private Git cannot run' }
          } catch {
              Remove-Item -LiteralPath $Root -Recurse -Force
              throw
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/local-windows-tools
        timeout-minutes: 20
        with:
          nsis: 'true'
      - name: Install locked compile dependencies
        timeout-minutes: 15
        shell: pwsh
        run: pip install --require-hashes -r backend/requirements.lock -r desktop/requirements.lock
      - name: Compile frontend from the same checkout
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend compilation failed' }
      - name: PowerShell syntax and self-hosted execution refusal
        shell: pwsh
        run: |
          Get-ChildItem deploy/windows,scripts/release -Filter *.ps1 -Recurse | ForEach-Object {
              $Tokens = $null; $ParseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors)
              if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
          }
          try {
              & ./scripts/release/build-windows.ps1 -OutputDir 'must-not-exist'
              throw 'Unsafe build unexpectedly accepted the self-hosted runner'
          } catch {
              if ($_.Exception.Message -notlike 'Frozen executable validation requires a disposable GitHub-hosted Windows runner*') { throw }
          }
          if (Test-Path 'must-not-exist') { throw 'Refused build modified the checkout' }
      - name: Freeze application and compile NSIS without executing product binaries
        shell: pwsh
        run: ./scripts/release/build-windows.ps1 -CompileOnly -MakeNsis $env:SMD_MAKENSIS
      - name: Freeze independent bench without launching Chromium or installation
        # Playwright's socket timeout does not bound the complete browser transfer.
        timeout-minutes: 15
        shell: pwsh
        run: |
          pip install --require-hashes -r tools/bench/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Bench dependency installation failed' }
          python tools/bench/freeze.py --output artifacts/bench --work artifacts/bench-work
          if ($LASTEXITCODE -ne 0) { throw 'Bench freeze failed' }
          python scripts/release/package_bench.py --bundle artifacts/bench/SmdBench --inventory-only
          if ($LASTEXITCODE -ne 0) { throw 'Frozen bench inventory differs' }
      - name: Record compile identity and limits
        shell: pwsh
        env:
          SMD_RUNNER_NAME: ${{ runner.name }}
        run: |
          $Commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $Commit -cne $env:GITHUB_SHA) { throw 'Build source identity mismatch' }
          $Version = (& python scripts/release/metadata.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source version mismatch' }
          $Files = @("artifacts/SmdHmi-$Version-windows-x64.exe", 'artifacts/manifest.json', 'artifacts/bench/SmdBench/tool-manifest.json')
          $Hashes = [ordered]@{}
          foreach ($File in $Files) { $Hashes[$File] = (Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash.ToLowerInvariant() }
          $Result = [ordered]@{runner=$env:SMD_RUNNER_NAME; commit=$Commit; version=$Version; scope='compile-only'; files=$Hashes} | ConvertTo-Json -Depth 3 -Compress
          Write-Output $Result
          $Result >> $env:GITHUB_STEP_SUMMARY
          'Compilation only; frozen execution, service/ACL, install, upgrade, uninstall and GUI acceptance remain unverified here. These bytes are not release candidates.' >> $env:GITHUB_STEP_SUMMARY
      - name: Clean this Windows job's tools and generated files
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SMD_CI_WINDOWS_ROOT -and (Test-Path -LiteralPath $env:SMD_CI_WINDOWS_ROOT)) {
              $Root = [IO.Path]::GetFullPath($env:SMD_CI_WINDOWS_ROOT)
              $Parent = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
              $Prefix = 'smd-hmi-{0}-{1}-{2}-' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:GITHUB_JOB
              if ([IO.Path]::GetDirectoryName($Root) -ne $Parent -or
                  [IO.Path]::GetFileName($Root) -notmatch ('^' + [regex]::Escape($Prefix) + '[0-9a-f]{32}$') -or
                  ((Get-Item -LiteralPath $Root).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw 'Unexpected Windows job tools path'
              }
              try {
                  # Checkout may not have completed; the tools still need cleanup.
                  if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.git')) {
                      Set-Location $env:GITHUB_WORKSPACE
                      $GitRoot = (& git rev-parse --show-toplevel)
                      if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($GitRoot) -ne [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)) {
                          throw 'Refusing cleanup outside this checkout'
                      }
                      git clean -ffdxq
                      if ($LASTEXITCODE -ne 0) { throw 'Checkout cleanup failed' }
                  }
              } finally {
                  # Windows PowerShell 5.1 cannot recursively remove npm cache paths
                  # beyond MAX_PATH. Use the system command with an extended path;
                  # no process from the tools directory may remove its own runtime.
                  Set-Location $Parent
                  $LongRoot = '\\?\' + $Root
                  & $env:ComSpec /d /c "rd /s /q `"$LongRoot`""
                  if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $Root)) {
                      throw 'Windows job tools cleanup failed'
                  }
                  Write-Output 'Removed this job tools directory, including long cache paths'
              }
          }
  windows-build:
    needs: [lint, backend, frontend, audit]
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      candidate-id: ${{ steps.upload-candidate.outputs.artifact-id }}
      candidate-identity: ${{ steps.candidate.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            desktop/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock -r desktop/requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: choco install nsis --version=3.11 -y --no-progress
      - name: Freeze service, shell and updater; verify Fixed Runtime; compile NSIS
        shell: pwsh
        run: ./scripts/release/build-windows.ps1
      - name: Build the separate offline bench and bundled Chromium
        shell: pwsh
        run: |
          pip install --require-hashes -r tools/bench/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Bench dependency installation failed' }
          python tools/bench/freeze.py --output artifacts/bench --work artifacts/bench-work
          if ($LASTEXITCODE -ne 0) { throw 'Bench freeze failed' }
          & ./artifacts/bench/SmdBench/SmdBench.exe self-check
          if ($LASTEXITCODE -ne 0) { throw 'Frozen bench process and browser self-check failed' }
          python scripts/release/package_bench.py --bundle artifacts/bench/SmdBench --inventory-only
          if ($LASTEXITCODE -ne 0) { throw 'Frozen bench self-check changed the bundle inventory' }
      - name: Bind the candidate bytes to this build
        id: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = (& python scripts/release/metadata.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source version mismatch' }
          $Commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $Commit -cne $env:GITHUB_SHA) { throw 'Build source identity mismatch' }
          $Files = @("SmdHmi-$Version-windows-x64.exe", 'manifest.json', 'sbom.cdx.json', 'SHA256SUMS.txt',
              'CHANGELOG.md', 'UPGRADE.md', 'HOSTCOMM-2-RUNTIME.md', 'bench/SmdBench/tool-manifest.json')
          $Hashes = [ordered]@{}
          foreach ($Name in $Files) {
              $Hashes[$Name] = (Get-FileHash -LiteralPath (Join-Path artifacts $Name) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $Identity = @{schema_version=1;commit=$Commit;version=$Version;run_id=$env:GITHUB_RUN_ID;
              build_attempt=$env:GITHUB_RUN_ATTEMPT;files=$Hashes} | ConvertTo-Json -Depth 3 -Compress
          "version=$Version" >> $env:GITHUB_OUTPUT
          "identity=$Identity" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        id: upload-candidate
        with:
          name: windows-build-candidate-${{ github.run_attempt }}
          path: |
            artifacts/SmdHmi-${{ steps.candidate.outputs.version }}-windows-x64.exe
            artifacts/manifest.json
            artifacts/sbom.cdx.json
            artifacts/SHA256SUMS.txt
            artifacts/CHANGELOG.md
            artifacts/UPGRADE.md
            artifacts/HOSTCOMM-2-RUNTIME.md
            artifacts/bench/SmdBench/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-diagnostics
          path: |
            artifacts/freeze-work/**/warn-*.txt
            artifacts/bench-work/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 14
  windows-package:
    needs: [windows-build]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Require a successful candidate build
        shell: pwsh
        env:
          BUILD_RESULT: ${{ needs.windows-build.result }}
          CANDIDATE_ID: ${{ needs.windows-build.outputs.candidate-id }}
        run: |
          if ($env:BUILD_RESULT -cne 'success' -or $env:CANDIDATE_ID -cnotmatch '^[1-9][0-9]*$') {
              throw 'The required Windows candidate build did not succeed'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            desktop/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock -r desktop/requirements.lock
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows-build.outputs.candidate-id }}
          # ID downloads otherwise add the artifact-name directory, even for one ID.
          merge-multiple: true
          path: artifacts
      - name: Verify the transferred bytes and select release evidence scope
        id: scope
        shell: pwsh
        env:
          CANDIDATE_IDENTITY: ${{ needs.windows-build.outputs.candidate-identity }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $Version = (& python scripts/release/metadata.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source version mismatch' }
          $Commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $Commit -cne $env:GITHUB_SHA) { throw 'Consumer source identity mismatch' }
          $Identity = $env:CANDIDATE_IDENTITY | ConvertFrom-Json -AsHashtable
          if ($Identity.schema_version -ne 1 -or $Identity.commit -cne $Commit -or $Identity.version -cne $Version -or
              $Identity.run_id -cne $env:GITHUB_RUN_ID -or $Identity.build_attempt -cnotmatch '^[1-9][0-9]*$' -or
              [int]$Identity.build_attempt -gt [int]$env:GITHUB_RUN_ATTEMPT) { throw 'Candidate build identity mismatch' }
          $Files = @("SmdHmi-$Version-windows-x64.exe", 'manifest.json', 'sbom.cdx.json', 'SHA256SUMS.txt',
              'CHANGELOG.md', 'UPGRADE.md', 'HOSTCOMM-2-RUNTIME.md', 'bench/SmdBench/tool-manifest.json')
          if ($Identity.files.Count -ne $Files.Count) { throw 'Candidate digest list differs' }
          foreach ($Name in $Files) {
              if (-not $Identity.files.Contains($Name) -or
                  (Get-FileHash -LiteralPath (Join-Path artifacts $Name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $Identity.files[$Name]) {
                  throw 'Transferred candidate bytes differ from the builder'
              }
          }
          foreach ($Name in @('manifest.json', 'bench/SmdBench/tool-manifest.json')) {
              $Manifest = Get-Content -LiteralPath (Join-Path artifacts $Name) -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($Manifest.schema_version -ne 1 -or $Manifest.platform -cne 'windows-x64' -or
                  $Manifest.commit -cne $Commit -or $Manifest.version -cne $Version) { throw 'Transferred manifest identity mismatch' }
          }
          python scripts/release/package_bench.py --bundle artifacts/bench/SmdBench --inventory-only
          if ($LASTEXITCODE -ne 0) { throw 'Transferred bench inventory differs from the builder' }
          "stable=$($Version -match '^\d+\.\d+\.\d+$')".ToLower() >> $env:GITHUB_OUTPUT
      - name: Install NSIS and verify the isolated LocalService backend
        shell: pwsh
        run: |
          $Version = (& python scripts/release/metadata.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source version mismatch' }
          ./scripts/release/smoke-windows.ps1 -Installer "artifacts/SmdHmi-$Version-windows-x64.exe" -Manifest artifacts/manifest.json -Evidence artifacts/windows-install-smoke.json
      - name: Verify real RC upgrades, retained data, repair and legacy recovery
        if: steps.scope.outputs.stable == 'true'
        shell: pwsh
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory artifacts/previous-installers | Out-Null
          gh release download v0.3.0-rc.4 --pattern SmdHmi-0.3.0-rc.4-windows-x64.exe --dir artifacts/previous-installers
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve immutable rc.4 installer' }
          gh release download v0.3.0-rc.5 --pattern SmdHmi-0.3.0-rc.5-windows-x64.exe --dir artifacts/previous-installers
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve immutable rc.5 installer' }
          $Rc4 = 'artifacts/previous-installers/SmdHmi-0.3.0-rc.4-windows-x64.exe'
          $Rc5 = 'artifacts/previous-installers/SmdHmi-0.3.0-rc.5-windows-x64.exe'
          if ((Get-FileHash $Rc4 -Algorithm SHA256).Hash.ToLower() -ne 'aa266300e3ecfaa8d9212417adfdcbdc9474159a8793e03ce323b89fc64020e9') { throw 'rc.4 immutable asset changed' }
          if ((Get-FileHash $Rc5 -Algorithm SHA256).Hash.ToLower() -ne '2950fac76760f76d041f51174948b1be1658815e6762f51d9173c9b5b6fa0de0') { throw 'rc.5 immutable asset changed' }
          $Version = (& python scripts/release/metadata.py).Trim()
          ./scripts/release/windows-overwrite-acceptance.ps1 -CurrentInstaller "artifacts/SmdHmi-$Version-windows-x64.exe" -Rc4Installer $Rc4 -Rc5Installer $Rc5 -EvidenceDir artifacts/overwrite-evidence
      - name: Installed TLS, experiment, recovery and report loop
        shell: pwsh
        timeout-minutes: 25
        run: |
          $Version = (& python scripts/release/metadata.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source version mismatch' }
          & ./artifacts/bench/SmdBench/SmdBench.exe run --installer "artifacts/SmdHmi-$Version-windows-x64.exe" --manifest artifacts/manifest.json --evidence artifacts/bench-evidence --scenario all
          if ($LASTEXITCODE -ne 0) { throw 'Installed HostComm bench failed; inspect sanitized evidence' }
          python scripts/release/package_bench.py --bundle artifacts/bench/SmdBench --output artifacts --evidence artifacts/bench-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Bench packaging or acceptance gate failed' }
      - name: Bind software stable acceptance to actual installer and bench bytes
        if: steps.scope.outputs.stable == 'true'
        shell: pwsh
        run: |
          python scripts/release/assemble_acceptance.py --artifacts artifacts --overwrite-evidence artifacts/overwrite-evidence --bench-evidence artifacts/bench-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Software acceptance evidence is incomplete or mismatched' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-diagnostics
          path: |
            artifacts/windows-install-smoke.json
            artifacts/bench-evidence/**
            artifacts/overwrite-evidence/**
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-offline-installer
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/bench-manifest.json
            artifacts/bench-acceptance.json
            artifacts/manifest.json
            artifacts/sbom.cdx.json
            artifacts/SHA256SUMS.txt
            artifacts/*.md
            artifacts/software-acceptance.json
            artifacts/windows-acceptance.json
            artifacts/installer-*.json
            artifacts/*.log
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-metadata
          path: |
            artifacts/manifest.json
            artifacts/bench-manifest.json
            artifacts/bench-acceptance.json
            artifacts/sbom.cdx.json
            artifacts/SHA256SUMS.txt
            artifacts/*.md
            artifacts/software-acceptance.json
            artifacts/windows-acceptance.json
            artifacts/installer-*.json
            artifacts/*.log
          if-no-files-found: error
          retention-days: 90
