name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: 后端 (pytest + 安全红线)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      # 安全红线必须最先运行（CLAUDE.md 第 2 / 7 节）
      - name: Safety red-line (MUST pass first)
        run: pytest tests/test_safety.py -v

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Full backend suite
        run: pytest -q

  frontend:
    name: 前端 (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
