name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同一分支的新提交自动取消旧跑批，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查 (black + isort)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install deps
        run: pip install --require-hashes -r requirements-dev.lock

      # 配置见 backend/pyproject.toml（行长 120，迁移目录除外）
      - name: black --check
        run: black --check app tests

      - name: isort --check-only
        run: isort --check-only app tests

  backend:
    name: 后端 (${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 与工控机部署版本一致；3.12 提前暴露升级问题
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          # 部署目标平台是 zh-CN Windows 工控机（历史上已有 alembic.ini 编码崩溃先例）
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install deps
        run: pip install --require-hashes -r requirements-dev.lock

      # 安全红线必须最先运行（CLAUDE.md 第 2 / 7 节）
      - name: Safety red-line (MUST pass first)
        run: pytest tests/test_safety.py -v

      - name: Alembic upgrade head（空库 → 最新 schema）
        run: alembic upgrade head

      # 商用候选分支按全后端 80% 门槛阻断回退。
      - name: Full backend suite + coverage gate
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=80

      - name: Windows deployment script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem ../deploy/windows/*.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
          }
          python -m py_compile ../deploy/windows/backup_database.py ../deploy/windows/verify_bundle.py

  frontend:
    name: 前端 (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 14

  # 依赖漏洞审计：高危漏洞阻断合并，完整机制见 issue #12
  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit（后端运行依赖）
        run: pipx run pip-audit -r backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit（前端）
        working-directory: frontend
        run: npm audit --audit-level=high
