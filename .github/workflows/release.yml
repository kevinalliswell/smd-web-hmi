name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-offline-installer
          path: artifacts
      - name: Verify final installer digest
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require candidate release eligibility
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release/publish_gate.py --manifest artifacts/manifest.json --tag "$RELEASE_TAG"
      - name: Publish checked candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.exe artifacts/manifest.json artifacts/sbom.cdx.json artifacts/SHA256SUMS.txt artifacts/*.md --verify-tag --generate-notes --prerelease
