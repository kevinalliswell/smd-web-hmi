name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      local_mac: true
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-offline-installer
          path: artifacts
      - name: Verify final installer digest
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require artifact-bound release eligibility
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          evidence_options=()
          if [[ "$RELEASE_TAG" != *-rc.* ]]; then evidence_options+=(--software-acceptance artifacts/software-acceptance.json); fi
          python scripts/release/publish_gate.py --manifest artifacts/manifest.json --tag "$RELEASE_TAG" --artifacts-dir artifacts "${evidence_options[@]}"
      - name: Publish checked software artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          release_options=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then release_options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.exe artifacts/*.zip artifacts/manifest.json artifacts/bench-manifest.json artifacts/*-acceptance.json artifacts/installer-*.json artifacts/*.log artifacts/sbom.cdx.json artifacts/SHA256SUMS.txt artifacts/*.md --verify-tag --generate-notes "${release_options[@]}"
