name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-offline-installer
          path: artifacts
      - name: Verify final installer digest
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish checked artifacts with accurate prerelease status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.exe artifacts/manifest.json artifacts/sbom.cdx.json artifacts/SHA256SUMS.txt "${args[@]}"
