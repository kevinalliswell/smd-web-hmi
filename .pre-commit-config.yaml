# 提交前钩子（CLAUDE.md §5：black + isort + ESLint）。
# 启用：pip install pre-commit && pre-commit install
# 工具配置统一读取 backend/pyproject.toml。
repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
