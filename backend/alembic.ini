# Alembic config -- smd-web-hmi backend
# NOTE: keep this file ASCII-only. configparser reads it with the system locale
# codec (GBK on zh-CN Windows), so non-ASCII bytes raise UnicodeDecodeError.
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# sqlalchemy.url is injected in env.py from app.core.config (placeholder here).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
