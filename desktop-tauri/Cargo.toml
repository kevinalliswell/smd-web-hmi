[package]
name = "smd-desktop"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "SmdDesktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
